[package]
name = "libsrtp_rs"
version = "0.1.0"
authors = ["Richard Barnes <rlb@ipv.sx>"]
edition = "2018"

[lib]
crate-type = ["staticlib"]

[profile.test]
opt-level = 0
debug = true

[features]
rust-crypto = ["hmac", "sha-1", "constant_time_eq"]
openssl-crypto = ["openssl", "ouroboros"]
cffi = ["libc", "cstr", "cpu-time", "rand"]
default = ["rust-crypto"]

[dev-dependencies]
hex = "0.4.3"
rand = "0.8.3"

[dependencies]
num_enum = "0.5.1"         # For enum conversion to numeric values
packed_struct = "0.5"      # For RTP header parsing
hex-literal = "0.3.3"      # For test vector literals

# C FFI dependencies
cpu-time = { version = "1.0.0", optional = true }  # For cipher performance testing in C interface
cstr = { version = "0.2.8", optional = true }      # For C string constants
libc = { version = "0.2.93", optional = true }     # Only until we can get rid of src/c/alloc.rs
rand = { version = "0.8.3", optional = true }      # For rand_for_tests functions

# Rust Crypto dependencies
aes = "0.7.4"
aes-gcm = { version = "0.9.2", features = ["aes"] }
cipher = "0.3.0"
constant_time_eq = { version = "0.1.5", optional = true }
ctr = "0.7.0"
hmac = { version = "0.11.0", optional = true }
sha-1 = { version = "0.9.6", optional = true }

# OpenSSL dependencies
openssl = { version = "0.10", optional = true }
ouroboros = { version = "0.10.1", optional = true }
